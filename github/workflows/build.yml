
name: Build CalendarPro 2.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-28"
          sdkmanager "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q CalendarPro_2.0_repaired_source.zip -d source
          ls -la source/update/calendar-pro

      - name: Build APK
        run: |
          cd source/update/calendar-pro

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-28/android.jar"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          export ZIPALIGN="$BT/zipalign"
          export APKSIGNER="$BT/apksigner"
          export R8_JAR="$BT/lib/d8.jar"

          chmod +x build_apk.sh
          bash build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalendarPro-2.0-APK
          path: source/update/calendar-pro/dist/CalendarPro.apk
          if-no-files-found: error
          
